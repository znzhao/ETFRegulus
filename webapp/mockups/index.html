header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface);

  const end = failed ? "2026-10-08" : "2026-10-09";

  for (let d = ms("2004-01-02"); d <= ms("2026-10-09"); d += DAY) { const w = new Date(d).getUTCDay(); if (w && w < 6) sessions.push(d); }

    if (d > ms("2009-03-09") && d <= ms("2009-12-31")) return [.002, .014, 1, 0];

      const beta = bond && u.beta < 0.2 ? u.beta * bb : u.beta;
      R[i][t] = u.mu + beta * m + u.idio * g() + (bond ? bd * DUR[u.t] : 0);
      P[i][t] = sessions[t] < ms(u.inc) ? NaN : (t === 0 || isNaN(P[i][t - 1]) ? 50 + 150 * rnd() : P[i][t - 1] * (1 + R[i][t]));

}

function baseTarget(s, t, P, A) {
  const w = new Float64Array(A + 1), av = [];
  for (let i = 0; i < A; i++) if (!isNaN(P[i][t])) av.push(i);
  const idx = tk => UNIVERSE.findIndex(u => u.t === tk);
  if (s === "cash") { w[0] = 1; return w; }
  if (s === "spy_buy_hold") { w[1 + idx("SPY")] = 1; return w; }
  if (s === "spy_tlt_60_40") { w[1 + idx("SPY")] = .6; w[1 + idx("TLT")] = .4; return w; }
  if (s === "equal_weight") { av.forEach(i => w[1 + i] = 1 / av.length); return w; }
  if (s === "momentum") {
    const sc = av.filter(i => t >= 252 && !isNaN(P[i][t - 252])).map(i => [i, P[i][t] / P[i][t - 252] - 1]).filter(x => x[1] > 0).sort((a, b) => b[1] - a[1]).slice(0, 3);
    if (!sc.length) { w[0] = 1; return w; }
    sc.forEach(([i]) => w[1 + i] = 1 / 3); w[0] = 1 - sc.length / 3; return w;
  }
  // classical optimizer: inverse 63-day volatility, capped at 25%
  const iv = av.filter(i => t >= 63 && !isNaN(P[i][t - 63])).map(i => {
    let s2 = 0; for (let k = t - 62; k <= t; k++) { const r = P[i][k] / P[i][k - 1] - 1; s2 += r * r; } return [i, 1 / Math.sqrt(s2 / 63 + 1e-8)];
  });
  if (!iv.length) { w[0] = 1; return w; }
  let tot = iv.reduce((a, x) => a + x[1], 0);
  iv.forEach(([i, v]) => w[1 + i] = Math.min(.25, v / tot));
  w[0] = Math.max(0, 1 - w.reduce((a, b) => a + b, 0));
  return w;
}

function runStrategy(s, D, ses, R, P, N, A) {
  const eq = new Float64Array(N), ret = new Float64Array(N), dd = new Float64Array(N), W = new Float32Array(N * (A + 1));
  const lastBuy = new Float64Array(A).fill(-1e15);
  let w = new Float64Array(A + 1); w[0] = 1; let e = 1, mode = -1; const hist = []; const rebal = [];
  for (let t = 0; t < N; t++) {
    if (t > 0) {
      let r = 0; for (let i = 0; i < A; i++) r += w[i + 1] * R[i][t];
      e *= 1 + r; ret[t] = r;
      for (let i = 0; i < A; i++) w[i + 1] *= (1 + R[i][t]) / (1 + r);
      w[0] /= 1 + r;
    }
    eq[t] = e; hist.push(e); if (hist.length > 252) hist.shift();
    const pk = Math.max(...hist); dd[t] = 1 - e / pk;
    const m = dd[t] > D ? 2 : dd[t] > .6 * D ? 1 : 0;
    const monthStart = t === 0 || new Date(ses[t]).getUTCMonth() !== new Date(ses[t - 1]).getUTCMonth();
    if (monthStart || m !== mode) {
      const tg = baseTarget(s, t, P, A);
      const sc = m === 2 ? .2 : m === 1 ? .6 : 1;
      for (let i = 0; i < A; i++) if (!SAFE.has(UNIVERSE[i].t)) { tg[0] += tg[i + 1] * (1 - sc); tg[i + 1] *= sc; }
      let extra = 0; const locked = new Set();
      for (let i = 0; i < A; i++) if (w[i + 1] > tg[i + 1] && ses[t] - lastBuy[i] < LOCK_DAYS * DAY) { extra += w[i + 1] - tg[i + 1]; tg[i + 1] = w[i + 1]; locked.add(i); }
      const take = Math.min(extra, tg[0]); tg[0] -= take; extra -= take;
      if (extra > 1e-9) { let fr = 0; for (let i = 0; i < A; i++) if (!locked.has(i)) fr += tg[i + 1]; for (let i = 0; i < A; i++) if (!locked.has(i) && fr > 0) tg[i + 1] *= 1 - extra / fr; }
      const ch = [];
      for (let i = 0; i < A; i++) { const d = tg[i + 1] - w[i + 1]; if (Math.abs(d) > .002) { ch.push({ i, from: w[i + 1], to: tg[i + 1] }); if (d > 0) lastBuy[i] = ses[t]; } }
      if (ch.length) rebal.push({ t, ch });
      w = tg; mode = m;
    }
    W.set(w, t * (A + 1));
  }
  return { eq, ret, dd, W, rebal, lastBuy: Array.from(lastBuy), mode, D };
}

      <div class="field"><label for="f-peak">${t("peak")}</label><input id="f-peak" type="number" min="0" value="${S.peak}" data-set="peak"><span class="hint">${t("peakHint")}</span></div>`}
  </div>
  <div class="panel form">
    <div class="field"><span class="label2">${t("language")}</span>${seg("lang", [["zh", "中文"], ["en", "English"]], S.lang)}</div>
    <div class="field"><span class="label2">${t("theme")}</span>${seg("theme", [["system", t("system")], ["light", t("light")], ["dark", t("dark")]], S.theme)}</div>
    <div class="field"><span class="label2">${t("colors")}</span>${seg("updown", [["red-up", t("redUp")], ["green-up", t("greenUp")]], S.updown)}</div>
  </div>
  <div class="panel form"><div class="field"><span class="label2">${t("backup")}</span><span class="hint">${t("backupHint")}</span>
    <textarea id="f-backup" spellcheck="false">${JSON.stringify({ plan: S.plan, ceiling: S.ceiling, mode: S.mode, amount: S.amount, cash: S.cash, holdings: S.holdings, lang: S.lang, theme: S.theme, updown: S.updown })}</textarea>
    <div class="row"><button class="btn" id="b-copy">${t("copy")}</button><button class="btn primary" id="b-import">${t("importBtn")}</button><span id="b-msg" class="muted"></span></div></div></div>`;
}

function pageAbout() {
  const m = DATA.manifest;
  return `<h1>${t("about")}</h1>
  <div class="panel stack"><h2>${t("aboutStrategies")}</h2><table><tbody>${STRATS.map(s => `<tr><td style="white-space:normal"><span class="legend-sw" style="background:${SCOLOR[s]}"></span><b>${sn(s)}</b></td><td style="white-space:normal">${t("strategyDesc")[s]}</td></tr>`).join("")}</tbody></table></div>
  <div class="grid2"><div class="panel stack"><h2>${t("rules")}</h2><p style="margin:0">${t("rulesText")}</p></div>
  <div class="panel stack"><h2>${t("dataSources")}</h2><p style="margin:0">${t("dataText")}</p></div></div>
  <div class="panel stack"><h2>${t("pipeline")}</h2><table><tbody>
    <tr><td>${t("status")}</td><td>${m.status === "ok" ? `<span class="badge ok">${t("success")}</span>` : `<span class="badge bad">${t("failed")} · ${m.failedAt}</span>`}</td></tr>
    <tr><td>${t("dataAsOf")}</td><td class="num">${m.dataDate}</td></tr><tr><td>${t("lastRun")}</td><td class="num">${m.generatedAt}</td></tr>
    <tr><td>${t("nextRun")}</td><td class="num">${m.nextRun}</td></tr><tr><td>Code</td><td class="num">${m.code}</td></tr><tr><td>Config</td><td class="num">${m.config}</td></tr></tbody></table></div>
  <div class="alert">${t("disclaimer")}</div>`;
}

/* ============================================================ shell */
function route() { const h = (location.hash || "#today").slice(1); return h; }
function render() {
  charts.forEach(c => c.dispose()); charts = [];
  const root = document.documentElement;
  if (S.theme === "system") delete root.dataset.theme; else root.dataset.theme = S.theme;
  root.dataset.updown = S.updown; root.lang = S.lang === "zh" ? "zh-CN" : "en";
  root.dataset.dark = (S.theme === "dark" || (S.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) ? "1" : "0";
  document.getElementById("mockbar").innerHTML = `<span><b>${t("mockup")}</b> · ${t("fakeData")}</span>
    <span>${t("style")} ${seg("style", [["A", t("styleA")], ["B", t("styleB")]], S.style)}</span>
    <label><input type="checkbox" id="f-fail" ${S.failed ? "checked" : ""}> ${t("simFail")}</label>
    <span>${seg("lang", [["zh", "中文"], ["en", "EN"]], S.lang)}</span>`;
  const r = route(), base = r.startsWith("detail-") ? "strategies" : r;
  const links = ROUTES.map(k => `<a href="#${k}" ${k === base ? 'aria-current="page"' : ""}>${t(k)}</a>`).join("");
  document.getElementById("tabs").innerHTML = links;
  document.getElementById("btabs").innerHTML = ROUTES.map(k => `<a href="#${k}" ${k === base ? 'aria-current="page"' : ""}><svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>${t(k)}</a>`).join("");
  document.getElementById("topmeta").innerHTML = freshness();
  const app = document.getElementById("app");
  if (r.startsWith("detail-") && STRATS.includes(r.slice(7))) { app.innerHTML = pageDetail(r.slice(7)); drawDetail(r.slice(7)); }
  else if (r === "strategies") app.innerHTML = pageStrategies();
  else if (r === "compare") { app.innerHTML = pageCompare(); drawCompare(); }
  else if (r === "settings") app.innerHTML = pageSettings();
  else if (r === "about") app.innerHTML = pageAbout();
  else { app.innerHTML = pageToday(); if (S.style === "B" && S.mode === "sim") drawDonut(); }
}
const VIEW = { detailRange: v => detailRange = v, detailTab: v => detailTab = v, bench: v => bench = v, calYear: v => calYear = +v, cmpRange: v => cmpRange = v };
function setKey(k, v) {
  if (VIEW[k]) { VIEW[k](v); render(); return; }
  if (["ceiling", "amount", "cash"].includes(k)) v = +v;
  S[k] = v; save(); render();
}
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-set]"); if (b) { setKey(b.dataset.set, b.dataset.v); return; }
  const tr = e.target.closest("tr[data-go]"); if (tr) { location.hash = tr.dataset.go; return; }
  const rm = e.target.closest("[data-hrm]"); if (rm) { S.holdings.splice(+rm.dataset.hrm, 1); save(); render(); return; }
  if (e.target.closest("[data-hadd]")) { S.holdings.push({ t: "IEF", sh: 0, d: iso(DATA.sessions[lastIdx()]) }); save(); render(); return; }
  if (e.target.id === "b-copy") { const ta = document.getElementById("f-backup"), msg = document.getElementById("b-msg");
    navigator.clipboard?.writeText(ta.value).then(() => msg.textContent = t("copied"), () => { ta.select(); }); if (!navigator.clipboard) ta.select(); return; }
  if (e.target.id === "b-import") { const msg = document.getElementById("b-msg"); try { const x = JSON.parse(document.getElementById("f-backup").value); if (typeof x !== "object" || !x) throw 0; S = { ...S, ...x }; save(); render(); document.getElementById("b-msg").textContent = t("imported"); } catch (_) { msg.textContent = t("badJson"); } }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "f-fail") { S.failed = el.checked; save(); DATA = generate(S.failed); render(); return; }
  if (el.dataset.cmp) { const s = el.dataset.cmp; compareSel = el.checked ? STRATS.filter(x => x === s || compareSel.includes(x)) : compareSel.filter(x => x !== s); render(); return; }
  if (el.dataset.h !== undefined) { const h = S.holdings[+el.dataset.h]; h[el.dataset.k] = el.dataset.k === "sh" ? +el.value : el.value; save(); return; }
  if (el.dataset.set) setKey(el.dataset.set, el.value);
});
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", render);
render();
</script>
