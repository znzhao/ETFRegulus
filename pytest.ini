[pytest]
testpaths = tests
addopts = -m "not network and not slow" --strict-markers
markers =
    network: hits a live provider; excluded by default, run with `-m network`
    slow: real PPO updates or a full stage run; excluded by default to hold the suite
        under its 60s budget. Run with `-m slow` before trusting a training run --
        these are the tests that catch the whole stack failing to fit together.
