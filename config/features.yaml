# Feature definitions, windows, and scaling policy. Read by Stage 3.
#
# The list below is deliberately a *limited* set. Stacking many highly correlated
# indicators is a known trap; adding one is an experiment with a recorded ablation,
# not a default (reference/features.md section 1).

universe_config: config/universe.yaml

windows:
  returns:    [1, 2, 5, 10, 21, 63, 126, 252]
  volatility: [5, 10, 21, 63, 126, 252]
  drawdown:   [21, 63, 252]
  volume:     [21, 63]
  trend:      [20, 50, 100, 200]

technical:
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  atr_period: 14
  bollinger_period: 20
  bollinger_std: 2.0

scaling:
  # Robust (median / IQR) handles the fat tails in daily financial features far better
  # than mean/std. Fitted on a fold's TRAINING WINDOW ONLY -- full-sample scaling is
  # explicitly prohibited (IMPLEMENTATION_PLAN.md section 3).
  method: robust
  clip: 10.0
  leave_bounded_unscaled: true

folds:
  first_test_year: 2012
  last_test_year: 2025

epsilon: 1.0e-12
correlation_report_threshold: 0.95
