# The hard constraints: the holding lock, the drawdown ceiling, the projection backend,
# and the risk estimators. Read by Stages 4-9.
#
# This file is the canonical, machine-readable definition of the (N, D_max) parameter
# space. reference/decisions.md D16 and reference/env-mdp.md section 4 are the rationale;
# a test asserts the grids here match what those documents state.

lock:
  # Per-ETF, not portfolio-wide (D13). Buying ETF i relocks only ETF i.
  scope: per_etf          # {per_etf, portfolio} -- `portfolio` exists only as an ablation

  # N is in CALENDAR days, never trading days. The first legal sell date is the first
  # XNYS session on or after `execution_date + timedelta(days=N)`.
  hold_days:
    # The deployment value, and the one every report leads with (D16).
    primary: 30

    # The operating range the policy is trained and evaluated over: centred on 30 and
    # varying around it, from a fortnight to two months.
    #
    # A geometric ladder rather than an evenly spaced one, because a holding period is a
    # multiplicative quantity: going 30 -> 60 days is the same size of change as going
    # 30 -> 15, while 30 -> 45 and 30 -> 15 are not. The grid is centred on 30
    # GEOMETRICALLY -- weighted geometric mean 29.9 -- and an evenly spaced grid over the
    # same endpoints would sit at an effective centre above 30 while still looking
    # symmetric.
    #
    # REFINED 2026-09-03 from five rungs to nine: the step factor drops from sqrt(2)
    # (~1.41) to 2^(1/4) (~1.19), same endpoints. The coarse ladder left large gaps the
    # policy had to interpolate across -- 30 to 42 is a 40% jump in the constraint it is
    # conditioning on -- and the Stage 9 sweep could not distinguish a genuine trend in N
    # from noise between two distant rungs.
    values:  [15, 18, 21, 25, 30, 36, 42, 50, 60]

    # Sampled per episode, peaked on the primary value. Uniform if omitted. The point of
    # the weighting is that the policy spends most of its capacity where the constraint
    # will really sit, while still seeing enough of the tails to condition on N rather
    # than memorize one lock length.
    weights: [0.06, 0.08, 0.11, 0.13, 0.24, 0.13, 0.11, 0.08, 0.06]

    # Deliberately OUTSIDE the operating range. Used only by the Stage 9 sensitivity
    # sweep, to characterize how the policy degrades beyond what it was trained for.
    # Every result at one of these values is reported as out-of-distribution.
    #   N=0   -- the no-lock control; also curriculum stage 1's mechanics-only setting
    #   N=7   -- a weekly lock
    #   N=90  -- a quarterly lock
    #   N=180 -- the half-year extreme
    stress_values: [0, 7, 90, 180]

drawdown:
  # The maximum-drawdown ceiling. An ACTION-level safety constraint, never a guarantee
  # about the realized path, and never a reward penalty (D11, risk-envelope.md section 1).
  # REVISED again 2026-09-03: the range is 1% to 15%, at seven rungs rather than five.
  # The top was raised from 10% because 10% still bound in most years and left no cell
  # where the ceiling is merely a backstop; 15% is where the previous grid's second rung
  # sat, and it is a plausible mandate rather than the 25% that never bound at all.
  #
  # Earlier history of this grid, kept because both directions were informative:
  #
  # First revision cut the old 5%-25% grid, whose top end was a ceiling so loose it almost
  # never bound -- a "constraint" that does not constrain teaches the policy nothing about
  # operating under one. Second revision dropped the 0.1% and 0.5% cells from the bottom,
  # for the opposite reason: measured at 1%, the policy sits 78% in cash, and below that
  # the budget `1 - (1 - D_max) * P/V` falls under the 5-day CVaR of essentially any
  # equity holding, so the feasible set is cash and the cell teaches only "hold cash".
  # A fifth of training spent there was a fifth wasted.
  #
  # Roughly log-spaced, because a drawdown ceiling is a multiplicative quantity: 5% -> 10%
  # is the same size of change as 5% -> 2.5%. Weighted geometric centre ~3.1%. The grid
  # contains 1%, 5% and 10% exactly, which are the cells the reports lead with.
  max_drawdown:
    primary: 0.05
    values:  [0.01, 0.02, 0.03, 0.05, 0.075, 0.10, 0.15]
    # Uniform: unlike N, there is no single expected deployment value here -- the whole
    # point of conditioning on D_max is to serve a caller who picks their own ceiling.
    #
    # The degenerate cells that made uniform sampling wasteful are gone from the grid
    # itself, which is a cleaner fix than reweighting around them. 1% still binds hard
    # -- the policy holds ~78% cash there -- but it binds rather than forbidding.
    weights: null

projection:
  backend: analytic       # {analytic, cvxpy} -- D3; cvxpy is the correctness oracle in tests
  alpha_tolerance: 1.0e-3 # bisection tolerance on the de-risking scan (~10 risk evaluations)

risk:
  # CALIBRATED 2026-09-01 in Stage 5 (open question Q1 -- now closed). Chosen over 20
  # annual windows x 6 candidates x 2 baselines x 5 D_max; the table lives in the run's
  # `calibration.parquet` and the verdict in `baseline_summary.json`.
  #
  # Selected by DESIGN CONSTRAINT, with return only as a tie-break. A 2-day horizon
  # returned +8.45% against this setting's +7.92%, and was rejected: tuning the risk
  # layer on return is precisely the failure the envelope exists to prevent, and 0.5pp
  # across 20 folds is inside the noise.
  #
  # Resulting behaviour at the primary D_max = 0.15: mean fold intervention 0.062,
  # quiet in calm years and biting in the crises (2008 0.29, 2020 0.37, 2022 0.50).
  quantile: 0.05          # calibrated (was 0.01)
  horizon_days: 5         # must exceed one day: the constraint has to survive the
                          # overnight gap plus a few sessions, because the lock may
                          # prevent reacting
  block_length: 10        # mean block length, stationary bootstrap (geometric)
  aggregation: max        # {max, mean, quantile} -- `max` is the conservative default,
                          # and the right one for a hard constraint
  intervention_rate_ceiling: 0.50   # above this the envelope is over-calibrated

  # Only `cvar` is valid with the analytic projection backend: it is convex in `w`, which
  # is what makes the de-risking bisection sound. `var` is not convex and is a reporting
  # statistic only. See reference/risk-envelope.md section 5.
  measure: cvar

  estimators: [rolling, block_bootstrap, crisis_windows]

  # At decision time only windows that ENDED before the current session may be used: a
  # 2005 decision cannot be stress-tested against 2008. Stage 9 evaluation deliberately
  # uses the full library, and the two code paths are kept distinct.
  crisis_windows:
    gfc:           ["2007-10-01", "2009-03-31"]
    covid:         ["2020-02-19", "2020-03-23"]
    rate_shock_22: ["2022-01-01", "2022-10-31"]
    taper_tantrum: ["2013-05-01", "2013-09-30"]
    volmageddon:   ["2018-02-01", "2018-02-28"]
    selloff_18q4:  ["2018-10-01", "2018-12-31"]

execution:
  cost_bps: 0.0           # D10 -- frictionless at v1. Settled, not revisited. The code
                          # path exists and is unit-tested with a non-zero value.
