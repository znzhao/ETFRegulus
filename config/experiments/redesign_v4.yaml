# Anti-overfitting variant of redesign_v3 (2026-10-16): Gaussian noise (sd 0.1, scaled
# units) on the market features during training only. Planned campaign seeds_v4:
# setting very_high_entropy (ent_coef 0.05), 10 seeds, stopped at about 5% of the budget.
extends: redesign_v3.yaml

environment:
  obs_noise: 0.1

# The budget is the old 5% (6 rollouts of 16,384 steps), now called 100%; a checkpoint
# after every rollout (about every 16.7%).
training:
  total_timesteps: 98304
  checkpoint_every_rollout: true
