# Stage 5 (baselines), Stage 8 (walk-forward) and Stages 9-12 (robustness, report).
#
# Extends training.yaml rather than sim/default.yaml directly, because Stage 8 TRAINS: it
# needs the observation selection, the policy architecture and the PPO block as well as
# the simulator settings. training.yaml already pulls in sim/default.yaml and
# observation.yaml, so this is one edge rather than three.
extends: training.yaml

baselines:
  # All six run through the IDENTICAL simulator and constraint layer as the agent.
  # B1-B3 are primary; B4-B6 are named by the acceptance criteria (evaluation.md 5).
  names: [spy_buy_hold, momentum, spy_tlt_60_40, cash, equal_weight, classical_optimizer]
  params:
    spy_buy_hold:        {ticker: SPY}
    momentum:            {lookback_days: 252, skip_days: 21, top_n: 5, absolute_filter: true}
    spy_tlt_60_40:       {weights: {SPY: 0.60, TLT: 0.40}, drift_band: 0.05}
    equal_weight:        {drift_band: 0.05}
    classical_optimizer: {window: 252, max_weight: 0.25}

  # Snapshot a reachable state every N steps into the initial-state reservoir
  # (env-mdp.md 5, Approach A -- reachable by construction).
  reservoir_every: 21

  # The N-sensitivity control set. `spy_buy_hold` must be identical across all of these;
  # `momentum` must degrade monotonically.
  n_control_set: [0, 30, 90, 180]

# Risk-envelope calibration (open question Q1, risk-envelope.md 7).
# Run BEFORE Stage 7, using Stage 5, and record the table that justified the choice.
calibration:
  enabled: true
  baselines: [equal_weight, spy_tlt_60_40]
  d_max_grid: [0.01, 0.02, 0.03, 0.05, 0.075, 0.1, 0.15]
  intervention_rate_ceiling: 0.50
  min_horizon_days: 5        # must span the overnight gap plus several sessions (risk-envelope.md 3)
  candidates:
    - {name: default,     quantile: 0.01, horizon_days: 5, aggregation: max}
    - {name: mean_agg,    quantile: 0.01, horizon_days: 5, aggregation: mean}
    - {name: short_h,     quantile: 0.01, horizon_days: 2, aggregation: max}
    - {name: loose_q,     quantile: 0.05, horizon_days: 5, aggregation: max}
    - {name: loose_q_mean,quantile: 0.05, horizon_days: 5, aggregation: mean}
    - {name: loose_short, quantile: 0.05, horizon_days: 2, aggregation: mean}

walk_forward:
  first_test_year: 2012
  last_test_year: 2025
  seeds: 1
  candidates: 4
